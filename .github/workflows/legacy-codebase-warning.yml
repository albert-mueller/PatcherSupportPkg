# .github/workflows/legacy-codebase-warning.yml
#
# Warns on pull requests whose code is based on PatcherSupportPkg 2.0.4 or
# older (the old, pre-Dortania-fork codebase). Pull requests opened by
# Medelcartelinc are skipped.

name: Legacy codebase warning

on:
  # pull_request_target so the bot can also comment on PRs from forks.
  # The PR code is only inspected with git, never executed.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  # Highest version that still counts as "old codebase"
  LEGACY_MAX_VERSION: "2.0.4"
  UPSTREAM_REPO: "https://github.com/dortania/PatcherSupportPkg.git"
  MARKER: "<!-- legacy-codebase-warning -->"

jobs:
  check-version:
    # Skip all pull requests from Medelcartelinc
    if: github.event.pull_request.user.login != 'Medelcartelinc'
    runs-on: ubuntu-latest
    outputs:
      legacy: ${{ steps.detect.outputs.legacy }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Check out base repository (trusted)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect PatcherSupportPkg version of the PR
        id: detect
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Fetch PR head and tags from this repo and from upstream Dortania
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:pr-head"
          git fetch --tags --force origin
          git fetch --tags --force "$UPSTREAM_REPO" || true

          # Latest release tag reachable from the PR head
          TAG="$(git describe --tags --abbrev=0 pr-head 2>/dev/null || true)"
          VERSION="${TAG#v}"
          echo "Detected tag: '${TAG:-none}'"

          LEGACY=false
          if [ -n "$VERSION" ]; then
            LOWEST="$(printf '%s\n%s\n' "$VERSION" "$LEGACY_MAX_VERSION" | sort -V | head -n1)"
            if [ "$LOWEST" = "$VERSION" ]; then
              LEGACY=true
              echo "::warning title=Legacy codebase::This PR is based on PatcherSupportPkg ${VERSION} (<= ${LEGACY_MAX_VERSION})."
            fi
          else
            echo "::notice::No release tag reachable from the PR head, skipping check."
          fi

          echo "legacy=$LEGACY" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION:-unknown}" >> "$GITHUB_OUTPUT"

  comment:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Add, update or remove the warning comment
        uses: actions/github-script@v7
        env:
          LEGACY: ${{ needs.check-version.outputs.legacy }}
          VERSION: ${{ needs.check-version.outputs.version }}
        with:
          script: |
            const marker = process.env.MARKER;
            const legacy = process.env.LEGACY === 'true';
            const version = process.env.VERSION;
            const max = process.env.LEGACY_MAX_VERSION;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (!legacy) {
              // PR was updated to a newer codebase: clean up the old warning
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }

            const body = [
              marker,
              '> [!WARNING]',
              `> **This pull request is based on PatcherSupportPkg ${version}, which is ${max} or older (old codebase).**`,
              '>',
              '> The old codebase was a mix of several independent forks. Code from it may have unclear',
              '> licensing/attribution and tends to cause friction with the upstream Dortania developers.',
              '> This repository is now a proper fork of [dortania/PatcherSupportPkg](https://github.com/dortania/PatcherSupportPkg),',
              '> with our own patches applied on top.',
              '>',
              '> **Please update your source code** by rebasing your changes onto the current `master` branch',
              '> of this repository before this pull request is reviewed:',
              '>',
              '> ```sh',
              `> git remote add albert https://github.com/${owner}/${repo}.git`,
              '> git fetch albert',
              '> git rebase albert/master',
              '> git push --force-with-lease',
              '> ```',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
